# DEPTH BOARD - R9 through R15. Built 8/9.
#
# Why this exists: an audit of all 14 mock reps found 62% of skill picks were
# on NO board. The framework governed WHEN to take a position and said nothing
# about WHO after R8 - and R9-R15 is exactly where every remaining error lives
# (bye stacking, the 5RB/6WR inversion, team concentration). These are the
# names the reps actually reached for, now with a verdict attached.
#
# Sources 8/9: ESPN PPR top-160 (Field Yates), FantasyPros ADP + sleepers,
# PFF late-round WRs, FantasyLife/SI/DraftSharks tier work, RotoWire.
# REFRESH at the Aug 25 ADP pass and again after the Aug 29-30 cuts.

rule: >
  These are ranked suggestions, never commitments. A depth name NEVER outranks
  a live commitment, the RB/WR floors, the bye cap or the team cap. Work down
  the list, skip anything that breaks a cap, and take the best remaining.

w14_trap:
  weeks: [14]
  note: >
    THE DEPTH-ROUND TRAP. W14 is the seeding week and only ARI + DAL are on
    bye in it - a tiny pool that the depth rounds keep hitting anyway. Across
    14 reps Tyler Allgeier (ARI) was drafted 8 times and Brandon Aubrey (DAL)
    10 times, so most rosters walked into the seeding week with one or two
    players dark for no reason. Both are replaceable at their cost. Check the
    bye before taking either.

# ---------------------------------------------------------------------------
# THE R11-R15 BYE TRAP. Found 8/18 while answering "what do I take at 11-15".
# This board was built 8/9 as a flat ranked list and never checked against the
# bye cap on a realistic roster. It does not survive one.
# ---------------------------------------------------------------------------
bye_capacity:
  found: '8/18'
  severity: HARD
  headline: >
    R11-R15 is not a discipline problem, it is a supply problem. A fully
    on-plan R1-R10 spends W6, W7, W11 and W13 to the 2-per-week cap, and
    THREE of the five R12-R15 names live on W11. Under that baseline TEN of
    the sixteen names on this board's R11-R15 rounds are illegal, and R14 has
    NO legal named option at all. The fix is upstream: see choke_points.
  baseline:
    note: >
      The line this is derived from. Every entry is the top legal take on its
      own round in targets.yaml, following the R1-WR knock-on (R1 goes WR so
      R4 becomes RB2). It is a legal roster - no cap is broken reaching R11 -
      which is the point: the trap does not need a mistake to fire.
    picks:
    - {rnd: 1, player: Amon-Ra St. Brown, team: DET, bye: 6}
    - {rnd: 2, player: Drake Maye, team: NE, bye: 11}
    - {rnd: 3, player: Chase Brown, team: CIN, bye: 6}
    - {rnd: 4, player: James Cook III, team: BUF, bye: 7}
    - {rnd: 5, player: Tyler Warren, team: IND, bye: 13}
    - {rnd: 6, player: Cam Ward, team: TEN, bye: 9}
    - {rnd: 7, player: Rhamondre Stevenson, team: NE, bye: 11}
    - {rnd: 8, player: Rome Odunze, team: CHI, bye: 10}
    - {rnd: 9, player: Trevor Lawrence, team: JAX, bye: 7}
    - {rnd: 10, player: Josh Downs, team: IND, bye: 13}
  weeks_at_cap_by_r11: [6, 7, 11, 13]
  blocked:
    note: >
      Named take entries on targets.yaml R11-R15 that are ILLEGAL under the
      baseline above - their team's bye is already at cap before the round
      starts. Refusals already on an avoid list are not counted. These numbers
      are RECOMPUTED by the suite, so they cannot drift away from the boards.
    counts:
    - {rnd: 11, blocked: 1, of: 3}
    - {rnd: 12, blocked: 3, of: 4}
    - {rnd: 13, blocked: 1, of: 3}
    - {rnd: 14, blocked: 3, of: 3}
    - {rnd: 15, blocked: 2, of: 3}
    rounds_with_no_legal_option: [14]
    names:
    - {rnd: 11, player: Jordan Mason, team: MIN, bye: 6}
    - {rnd: 12, player: Rachaad White, team: WSH, bye: 7}
    - {rnd: 12, player: Jacory Croskey-Merritt, team: WSH, bye: 7}
    - {rnd: 12, player: Blake Corum, team: LAR, bye: 11}
    - {rnd: 13, player: Stefon Diggs, team: WSH, bye: 7}
    - {rnd: 14, player: Zach Charbonnet, team: SEA, bye: 11}
    - {rnd: 14, player: Blake Corum, team: LAR, bye: 11}
    - {rnd: 14, player: Jordan Mason, team: MIN, bye: 6}
    - {rnd: 15, player: Stefon Diggs, team: WSH, bye: 7}
    - {rnd: 15, player: Jayden Reed, team: GB, bye: 11}
  cascade: >
    The counts above are measured at the baseline, before any R11-R15 pick is
    made, so they are the FLOOR. Each pick you make in these rounds caps
    another week and blocks more of what is left. Worked example: take Dowdle
    (PIT W9) at R11 then Black (SF W8) at R12 then Higgins (HOU W8) at R13 and
    W8 and W9 both close, which takes R15 from 2-of-3 blocked to 3-of-3 - the
    only legal receiver left is Burden (CHI W10) off the R13 list.
  choke_points:
  - id: r7_second_w11_body
    round: 7
    baseline_team: NE
    swap_team: SF
    swap_name: Kaelon Black (SF W8) pulled up from R12
    frees_weeks: [11]
    fixes_rounds: [14]
    rule: >
      THE DECISIVE ONE. If Maye (NE W11) is your QB1 then Stevenson (NE W11)
      at R7 is your second NE body and it caps W11 - which is where Corum
      Charbonnet and Reed all live. Swapping R7 alone takes R14 from 3-of-3
      blocked to 1-of-3. Note Jadarian Price (SEA W11) is NOT an escape: same
      week, same problem.
  - id: r9_qb3_bye
    round: 9
    baseline_team: JAX
    swap_team: 'NO'
    swap_name: Tyler Shough (NO W8)
    frees_weeks: [7]
    fixes_rounds: []
    rule: >
      Lawrence (JAX W7) as QB3 caps W7 alongside Cook and kills the whole
      Washington cluster - White Croskey-Merritt and Diggs. Shough triangulates
      fine against Maye W11 and Ward W9. This one does NOT rescue R14 on its
      own - only R7 does - but it is what reopens R12 and R13.
  rule: >
    FROM R11 ON, PICK BY BYE SCARCITY AND NOT BY BOARD RANK. Spend the crowded
    weeks while their names are still legal and keep at least two weeks open
    going into R14. W5 and W9 hold only two teams each, so one body is half
    that week's entire supply, and there is no W12 bye at all. If every other
    week really is capped at R14 then Allgeier (ARI W14) stops being a CAUTION
    and becomes the only named back left - take him as your FIRST W14 body and
    never the second, and never with a W14 kicker.

# ---------------------------------------------------------------------------
# THE R14-R15 W6 TRAP. Named 8/21 after two consecutive reps took the SAME PAIR.
# ---------------------------------------------------------------------------
w6_late_trap:
  found: '8/21'
  severity: HARD
  weeks: [6]
  pair:
  - {player: Jauan Jennings, team: MIN, bye: 6}
  - {player: Malik Washington, team: MIA, bye: 6}
  note: >
    Rep 25 took Washington at R14 and Jennings at R15. Rep 26 took the IDENTICAL
    PAIR with the rounds swapped - Jennings at R14 and Washington at R15. Same
    two players, same two W6 byes, back to back. They are evidently what the
    board surfaces at the tail of the WR list, and taking both puts two bodies
    on the single most crowded week in the default build.
  why_w6_is_the_crowded_one: >
    W6 is CIN DET MIA MIN, and the default line already routes through it hard:
    St. Brown or Gibbs at R1, Chase Brown or Achane as an early back, Goff or
    Murray in the QB window, Jordan Mason at R11 or R14, McPherson on the kicker
    board. By R14 W6 is usually at or past target, so the last two skill picks
    are exactly where it tips.
  evidence: >
    Rep 26 finished with FIVE players on W6 - Gibbs, Willis, Mason, Jennings,
    Washington - the worst single-week hole ever recorded at slot 5. It was
    legal through R9 and then broke three times running at R11, R14 and R15.
    Rep 25 finished with four on W6 off the same R14/R15 pair.
  therefore: >
    TAKING BOTH IS A HARD REFUSE. At most one of Jennings or Washington, and
    only if W6 is genuinely under target when you get there - check the tally,
    do not assume. The partition says the last two skill picks belong on
    whichever weeks are still short, which in this build is almost never W6.
    Both reps left W8 at one with four teams available; that is where these
    picks should have gone.

rb:
- player: Rico Dowdle
  team: PIT
  bye: 9
  adp: RB37 (~109 overall)
  rounds: 9-11
  verdict: BUY
  why: Moved to Pittsburgh and profiles as the clearest early-down role of
    this tier. Highest floor of the R9-11 backs.
- player: Kyle Monangai
  team: CHI
  bye: 10
  rounds: 11-13
  verdict: OK
  why: Real early-down work in a Ben Johnson offense. Counts toward the CHI
    stack - Caleb, Odunze and Burden are all on this board too, all W10.
- player: Jordan Mason
  team: MIN
  bye: 6
  rounds: 11-13
  verdict: OK
  why: Standalone value if the Vikings backfield thins; bye W6 is a useful
    week to own given how often the reps piled onto W7/W10/W13.
- player: Zach Charbonnet
  team: SEA
  bye: 11
  rounds: 12-15
  verdict: SPECULATIVE
  why: On PUP off a torn ACL with a Week 1 return described as unlikely, but
    activatable any time before final cuts. A late stash, not a body you can
    start in September - and he is the direct handcuff to Price.
- player: Blake Corum
  team: LAR
  bye: 11
  rounds: 12-15
  verdict: OK
  why: Standard late-round backfield dart. Nothing wrong with him; nothing
    that separates him either.
- player: Tyler Allgeier
  team: ARI
  bye: 14
  rounds: 13-15
  verdict: 'CAUTION - W14'
  why: Drafted in 8 of 14 reps, and he is on the SEEDING WEEK bye. Fine as a
    body, but there is no reason to prefer him over an equivalent back on any
    other bye. If you want this tier, take the one who is not ARI or DAL.

wr:
- player: Rome Odunze
  team: CHI
  bye: 10
  adp: WR28
  rounds: 8-10
  verdict: STRONG BUY
  why: The best value on this board. Consensus WR28 while functioning as the
    focal point of Chicago's passing attack over a near two-month sample;
    widely flagged as a potential steal. Counts toward the CHI stack.
- player: Jayden Higgins
  team: HOU
  bye: 8
  adp: WR56 (~135-158 overall)
  rounds: 12-15
  verdict: BUY
  why: Best pure price-to-role gap left this late. Christian Kirk gone, the
    Texans room thinned, projections around 750 yards and 6-8 TDs at a
    mid-130s ADP. Drafted in 8 of 14 reps and correctly so.
- player: Jayden Reed
  team: GB
  bye: 11
  rounds: 10-12
  verdict: OK
  why: Already on the WR value board; kept here so the depth rounds read as
    one list.
- player: Stefon Diggs
  team: WSH
  bye: 7
  rounds: 14-15
  verdict: SPECULATIVE
  why: Late-round name-brand dart. Volume depends entirely on how Washington
    splits behind McLaurin.

te:
- player: Kenyon Sadiq
  team: NYJ
  bye: 13
  adp: TE20
  rounds: 14-15
  verdict: 'LEGAL, NOT DEFAULT (see te_board te2_rule)'
  why: Reopened 8/9 once FLEX was confirmed TE-eligible. Only after the RB and
    WR floors are met - he takes RB6 or WR5's spot and must beat them for the
    FLEX. Doubles as Warren insurance in a zero-IR league. Note bye W13 is the
    same as Warren's, so he does NOT cover that week.

fades:
- player: Jonathon Brooks
  team: CAR
  bye: 5
  adp: RB39 (~111 overall)
  why: Drafted in 7 of 14 reps, the most-taken name on this board, and the
    profile does not support the price. TWO torn ACLs, 23 career NFL snaps,
    missed all of 2025, and Chuba Hubbard may simply keep the lead role. The
    ADP is being pushed by camp hype, which is exactly the kind of rise the
    fade list exists for. Let someone else pay.
- player: Rashod Bateman
  team: BAL
  bye: 13
  why: Low ceiling as the WR2 behind Zay Flowers in a run-first offense,
    coming off a 2025 the coverage calls a disaster. Boom/bust with more bust.
    Taken in 3 reps; there are better W13-free options.

graduated:
- player: Luther Burden III
  team: CHI
  bye: 10
  moved_to: wr_board.value_board
  when: '8/16'
  why: >
    Was an R9-R12 depth name on 8/9. The ADP pass found him at WR21 / 47th
    overall - ranked AHEAD of Odunze (WR28) - so he is no longer a depth-round
    player at all and cannot be planned for at R11. Kept here as a tombstone so
    the 8/9 read is not silently lost; the live entry is on the WR value board.
