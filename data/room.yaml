  - Griddy Committee double-taps positions at turns; near a turn he counts as two QBs in the run math
  - Jag FLu burns two picks on D/ST + K by R10 every year - a standing two-player handicap the rest of
    the room splits
  - CHAMP's "QBs early" rep is stale (anchor-QB in reality) but he is live Warren competition (took him
    R6 in 2025)
  - 'The R9-10 vet-QB tier (QB3 inventory) is contested: Trey Action Fake and TheMoneyTeam are proven
