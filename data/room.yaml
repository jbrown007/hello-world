# The room model - 15 years of scouting on the other 11 managers, structured.
# This is the one dataset no tool or ADP feed can substitute for.
#
# Fill each manager's profile (shorthand is fine). Fields:
#   qb_habit:  early_hoarder | normal | waits_too_long | unknown
