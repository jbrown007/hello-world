    (8/2, R1-17): 34 QBs drafted in total - the QB_LADDER supply figure is exact. Cumulative: 8 by R4,
    8 by R5, 14 by R6, 18 by R7, 21 by R8, ~25 by R9 (Goff/Ward/Geno/Lawrence tier), 28 by R10, then a
    trickle to 34 by R17.'
