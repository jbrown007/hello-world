call: 'Tyler Warren R4-R5, GATED: if arriving at R5 below two RBs, RB wins and Warren is released - backfill
  TE R7-8. No TE2 ever. Sadiq is a waiver watch, not a draft pick.'
stack_cap_ref: See data/stack_caps.yaml (IND, single source of truth).
te2_rule: One and done. Warren is the only TE on the roster - no second starting path exists (FLEX is
  RB/WR, OP belongs to QB2). Do not draft a TE2; stream if he is hurt. Rookie TE watchlist row is a waiver
  monitor, not a pick.
