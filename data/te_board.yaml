  verdict: Too expensive - collides with the RB window.
- id: B
  name: Anchor in the middle
  cost: R4-R5
  who:
  - Tyler Warren
  verdict: RECOMMENDED. Stacks with Daniel Jones.
- id: C
  name: Punt properly
  cost: R12-R15 x2
  who:
  - Kenyon Sadiq
  - Sam LaPorta
  - Grant Stowers
  verdict: NOT AVAILABLE at 17 spots (8/1). FLEX excludes TE and OP belongs to QB2, so a TE2 is a bench
