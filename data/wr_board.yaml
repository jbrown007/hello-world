round_plan:
  1-4: QB1 (branch A/B/C), two RBs (floor), one WR. See commitments.yaml branch_map.
  5-6: Warren R4-5 (gated on RB floor), QB2 at the R5/R6 turn - earliest R5, floor R6.
  '7': Downs (R7). Pierce is conditional-if-he-falls-past-R8 only.
  8-15: 'Depth fill, zero slack: 4 RB + 3 WR + QB3 (R10-13) in exactly 8 picks.'
  16-17: K and D/ST. Never earlier.
stack_cap_ref: See data/stack_caps.yaml (IND, single source of truth). Four Colts are recommended across
  boards against a cap of 2 - count before every IND pick.
