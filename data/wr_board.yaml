round_plan:
  1: Allen. If gone, elite RB or Nacua.
  2-4: Split RB Tiers 1-2 and WR Tiers 2-3. Minimum one of each.
  5-7: QB2 per count rule (in hand by end of R6, hard floor), plus Downs (R7). Pierce
    is a value-note only - take him if he falls, never over the QB2.
  8-11: WR3-WR5 from the value board.
  12-15: QB3, handcuffs, rookie darts.
