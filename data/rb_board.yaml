provenance: Synthesized from trees.yaml, wr_board.yaml and watchlist.yaml - not recovered from the original
  xlsx tab. Review before draft day.
rule:
  note: Full PPR - the passing-down role is the fantasy-relevant one in every committee. Zero IR slots
    make injury-prone bell cows costlier in this league than their ADP assumes.
window:
  rounds: 1-4
  note: 'The RB floor (data/rb_rule.yaml, NEW 8/1): 2 RBs by end of R4 non-negotiable, 3 by R8, 5 by R12.
    Mirrors the QB count rule because the 2025 failure (QB/QB/TE early, first RB at pick 65) had no rule
    to stop it. Two RB slots + RB/WR flex = three starting slots.'
tiers:
- tier: 1
  who:
  - Jahmyr Gibbs
  - Bijan Robinson
  note: The R1 pivot if Josh Allen is gone (trees.yaml). Do not reach for QB2-5 tier arms over these.
- tier: 2
  who: []
  note: UNKNOWN - the original tier membership was never captured in YAML. Fill from the August ADP pass
    before building slot trees.
targets:
- player: Rhamondre Stevenson
  team: NE
  adp: RB28
  round: 7-8
  why: The value side of the Patriots committee - primary back in the playoff run (5.7 YPC over the final
    8 games), beat writers project him as the 2026 starter. Value-if-available only - never over the QB2
    floor or Downs (R7).
- player: Jadarian Price
  team: SEA
  adp: null
  round: null
  why: First-round rookie into a vacated job with Charbonnet expected to miss the start of the season.
    Target ahead of ADP - cleanest path to early-season volume in the league. Still Unsettled - confirm
    Charbonnet's timeline in camp.
- player: Kaelon Black
  team: SF
  adp: null
  round: 12-15
  why: Highest handcuff EV in the league - McCaffrey is 30, led the NFL in touches again, and the front
    office wants his workload cut. The 49ers RB2 has standalone value in this scheme.
- player: Rachaad White + Jacory Croskey-Merritt
  team: WSH
  adp: null
  round: 12-15
  why: Buy the whole Commanders backfield late and own the winner. White is the PPR play (50+ catches
    in three of four seasons); JCM is the grinder.
fades:
- player: TreVeyon Henderson
  team: NE
  adp: RB21
  why: Priced as a lead back he has not been - pass-blocking graded poorly and Stevenson finished the
    playoff run as the primary back. Fade at RB21.
- player: R.J. Harvey / J.K. Dobbins
  team: DEN
  adp: RB21 / RB41
  why: Committee with no bell cow - Harvey averaged 7.5 touches with Dobbins active, and Denver re-signed
    Dobbins AND drafted Coleman. Flex, not RB2.
- player: Veteran timeshares (Pollard, Spears, Dowdle/Warren, JAX rotation)
  team: multi
  adp: null
  why: Fade all at bell-cow ADP. Committee until proven otherwise - flex bodies, not RB2s. Let someone
    else pay.
round_plan:
  1-4: TWO RBs land here (floor). R1 is best-available RB/WR per the branch map.
  5-8: Third RB by end of R8 (flex starter). R9+ backs are committee/handcuff profiles.
  9-12: 'Fill to 5 RBs by R12. Zero-slack ledger: 4 RBs total in R8-15.'
  13-15: RB6 + darts ONLY by displacing a named ledger pick explicitly (Black, White+JCM).
