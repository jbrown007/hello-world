anchor: Josh Allen at 1.01. If gone, best Tier 1 arm or pivot to elite RB.
hard_floor_round: 6
qb2_earliest_round: 5
qb3_rounds:
- 9
- 13
run_trigger:
  qbs: 3
  window_picks: 12
  note: '3+ QBs off the board inside any 12-pick window means the run has started. Take QB2 on your NEXT
    pick regardless of round or count. Overrides the count thresholds. Against 2025 this fires at pick
    66; counting totals instead got you Stafford.

    '
rules:
- max_round: 4
  thresholds:
  - gone: 10
    action: TAKE_QB2_NOW
    note: Above 2025 pace (8 through R4). The room is running hot - do not wait for the R6 run.
  - gone: 7
    action: NORMAL
    note: At 2025 pace. Take the skill player. Re-check next round.
  - gone: 0
    action: WAIT
    note: Below pace. The room is waiting. You wait too - but never spend R2-R4 on QB2 (earliest is R5).
- max_round: 5
  thresholds:
  - gone: 12
    action: TAKE_QB2_NOW
    note: Run started a round early. Take yours now.
  - gone: 9
    action: BY_ROUND_6
    note: Above pace. QB2 by the end of Round 6, front of the run.
  - gone: 0
    action: WAIT_TO_6
    note: 'R5 was this room''s DEAD ZONE in 2025 (zero QBs taken). EARLY slots: take QB2 at your R5 pick
      anyway - you wait ~23 picks to R6 and the run fires inside that gap. Everyone else: R5 is the value
      window (Kelce/Conner/G.Wilson tier fell here in 2025) - buy, then take QB2 at R6.'
tier_beats_round: 'If the last Tier 2 arm is on the board and everything behind him is Tier 3, take him
  a full round early. Tier gaps cost more than draft capital.

  '
stack_tiebreak: 'Weekly high-score payouts reward correlation. When two QBs grade close, take the one
  whose WR1 you own or can get.

  '
qb3_test: 'Trade-inventory slot (QB_LADDER.md). All three required: named Week 1 starter (no competition
  stashes - a rookie project cannot be sold to a buyer who needs points this week); bye different from
  QB1/QB2; acquired R9-13 targeting the R9-10 vet tier (Goff/Ward/Geno/Lawrence went 9.05-9.11 in 2025).
  Do not telegraph it - Trey Action Fake, TheMoneyTeam and Kleenex compete for that tier.'
qb4: 'IN-SEASON ONLY (QB_LADDER.md). A drafted QB4 breaks the 6RB/5WR floor on 17 spots - rejected. In-season
  churn doctrine: acceptable profiles are a fallen starter or a backup with a genuine path; first drop
  when RB/WR attrition bites, except mid-negotiation.'
