te:
  values:
  - player: Tyler Warren
    team: IND
    rank: TE4
    adp: 61
    tag: '[1QB]'
    note: >
      76-817-4 as a rookie on a team-leading 112 targets, finished TE5. The
      second-half fade (11.1 ppg over ten games, then 5.6 over seven) tracks
      Daniel Jones's injuries, and Jones is healthy in camp. PITTMAN'S TRADE
      FUNNELS MORE VOLUME TO HIM with no pass-catching replacement added.
      PRICE CHECK: ADP 61 in 1QB converts to roughly pick 72-80 in superflex
      (ESTIMATE). Slot 5 takes him at pick 53, which is about 20 picks early -
      but the R5 call is not a value claim, it is a scarcity claim against
      CHAMP at pick 42 and 55. Worth measuring properly on Aug 25: if he really
      lasts to the 70s in superflex, the whole Warren-at-R5 rule is buying
      insurance the market is not charging for, and that pick could go to a
      starter instead.
