  movers:
  - player: Josh Downs
    team: IND
    adp: 8.08
    overall: 92
    verdict: TRIGGER FIRED - TIGHTEN THE WINDOW
    note: >
      wr_board pre-registered this exact test on 8/4: "if his ADP has climbed
      into the R7-8 range by then, tighten the window back". It has. He is
      going at pick 92 - which is slot 5's R8 pick, EXACTLY. The R10 deadline
      (pick 116) is now 24 picks past his market price and would be a
      guaranteed miss, the mirror image of the R7-only rule that produced nine
      straight misses in July. Driver: MICHAEL PITTMAN JR WAS TRADED TO
      PITTSBURGH and Alec Pierce is on PUP, so Downs escapes his sub-60% snap
      share and inherits the slot outright.
  - player: Luther Burden III
    team: CHI
    rank: WR21
    overall: 47
    verdict: DEPTH BOARD IS BADLY STALE
    note: >
      depth_board has him at rounds 9-12. He is going 47th overall and is now
      ranked AHEAD of Odunze (WR21 vs WR28) - the market has flipped the two
      Bears since 8/9. He will not last to R9 at this slot. Either take him
      early enough to matter or take him off the plan; do not pencil him into
      R11 and expect him there.
  - player: Rome Odunze
    team: CHI
    rank: WR28
    overall: 62
    verdict: HOLDS, roughly
    note: >
      Two readings found - WR28/62nd overall and a hotter 5.01/49th. Converted
      to superflex, 62nd overall lands near pick 75-85, so the depth board's
      R8-R10 window is about right and his R8 slot on the target board
      (pick 92) may already be a round late. The STRONG BUY tag survives.
  - player: Jayden Higgins
    team: HOU
    rank: WR55
    overall: 137
    verdict: HOLDS
    note: Depth board said WR56 / ~135-158. Dead on. No change.

