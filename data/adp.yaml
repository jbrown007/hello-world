# ADP SNAPSHOT - 8/16/2026. Nine days ahead of the scheduled Aug 25 pass,
# pulled because the target board had an unnamed R4 WR commitment.
#
# READ THIS BEFORE USING THE NUMBERS. Almost every public ADP is 1-QB PPR.
# This league is SUPERFLEX, where roughly 10-15 extra quarterbacks come off
# the board inside the first five rounds, so every skill player falls. A rough
# conversion for the R1-R8 band is: superflex pick = 1QB ADP + 10 to 20, and
# the gap widens as the QB run passes. Numbers below are tagged [1QB] or [SF];
# anything derived is marked ESTIMATE and should not be treated as measured.
#
# The room's own history overrides all of it. qb_board already says it:
# national ADP priced the QB2 tier at R4 and this room waited until R6. Trust
# the tally and the mock log over a national ranking.
#
# REFRESH: Aug 25 as scheduled, again after the Aug 29-30 cuts, and Sept 4-5.
# The single thing worth buying before then is a measured SUPERFLEX ADP source
# - every number here is 1QB unless marked, and that is the weakest part of
# this file.

pulled: '2026-08-16'
sources: >
  FlurrySports and FantasyLife (Downs), RotoWire and Footballguys WR/RB tiers,
  Athlon and CBS RB ADP reviews, SI/OnSI and ProFootballNetwork (Odunze,
  Burden), NFL.com and RotoBaller TE rankings (Warren), ESPN/FantasyPros and
  RotoBaller QB rankings, NFL.com and Yahoo (Mahomes medical). Web search only
  - fantasypros.com, espn.com and rotoballer.com are blocked by this
  container's egress proxy, so no full ADP table could be fetched directly.

market_shape:
  note: >
    THE BIGGEST SINGLE FINDING, and it is not about one player. Running backs
    are UP and wide receivers are DOWN across the 2026 market. Amon-Ra St.
    Brown, Justin Jefferson and CeeDee Lamb are reported falling to late R1 and
    sometimes R2. Gibbs and Bijan are going 1.01 and 1.02 in most rooms.
  consequences:
  - >
    AT PICK 5 BOTH TIER-1 RBs ARE PROBABLY GONE. Gibbs at ADP 1.0 and Bijan at
    2.0 do not reach the fifth pick. The R1 target list should be read as a WR
    list first at this slot - St. Brown or Nacua - with an elite arm as the
    Branch A exception.
  - >
    The WR discount is an OPPORTUNITY, not a warning. If receivers fall a round
    across the board, the R4 WR commitment buys a better player than the
    framework assumed when it was written.

# ---------------------------------------------------------------------------
qb:
  note: >
    All [1QB] unless marked. In superflex these all move up sharply - which is
    why the framework prices QB windows off the room's tally, not off ADP.
  values:
  - {player: Josh Allen, adp: 29, tag: '[1QB] consensus QB1 everywhere, six straight top-2 finishes'}
  - {player: Caleb Williams, adp: 73.4, tag: '[1QB] top-7 QB ADP - the Year-2 leap is now PRICED IN,
      which is exactly what the 8/16 camp watch said could not be verified before the draft'}
  - {player: Patrick Mahomes, adp: 101.6, tag: '[1QB] COLLAPSED on the knee - see medical below'}
  - {player: Baker Mayfield, adp: 125.6, tag: '[1QB] QB19-21 by rank; one analyst argues top-3 upside
      and calls the price far too low'}
  - {player: Kyler Murray, adp: null, tag: '[rank] QB16-17 - the post-naming bump the watchlist predicted'}
  - {player: Cam Ward, adp: null, tag: '[rank] QB24 - CHEAPEST of the QB2 tier by consensus, which
      confirms the qb_board order. But he went R6 in four separate mock reps, so this room buys him
      well ahead of his ranking. Trust the tally.'}
  medical:
    player: Patrick Mahomes
    what: Tore ACL and LCL on Dec 14, 2025. Surgery repaired more than the ACL.
    now: >
      FULLY CLEARED for training camp - Andy Reid says the knee has full
      strength and he looks sharp. Sat the preseason opener vs the Rams as a
      precaution. Targeting Week 1 (Sept 14 vs Denver); the doctor would not
      guarantee it.
    board_impact: >
      HE IS NO LONGER A BRANCH-C R3 ANCHOR. qb_board lists him in tier2_qb1
      alongside Caleb, Stroud and Herbert with no injury context at all, and
      the market has moved him roughly 70 picks below that group. Reprice him
      as a discounted upside arm in the QB2 band, not an anchor you plan
      around at pick 29.

