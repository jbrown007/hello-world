# QB tier board - WHO to take in each window. The count tally decides WHEN.
# Named 8/3 from national consensus (ESPN/CBS/SI/FTN superflex rankings and
# industry mocks) mapped onto the framework windows. National ADP prices the
# QB2 tier at R4; this room waited to R6 in 2025 - trust the tally, not ADP.
# REFRESH: at the Aug 25 ADP pass, and when the Vikings (~Aug 14) and Jets
# QB rows resolve.
provenance: 'Sources 8/3: ESPN superflex rankings (Karabell), CBS QB tiers (Richard,
  Cummings), SI QB tiers, FTN QB tiers (Ratcliffe), CBS industry superflex mock,
  ESPN superflex mock. Cross-checked against watchlist.yaml camp status.'

elite:
  note: 'The top-6 arms the QB1 branch map keys on. 2025 comp: six gone by pick
    23, all rushing/elite-volume.'
  trap: Allen and Daniels share the W7 bye - after either, QB2 cannot come from
    BUF/JAX/LAC/WSH.
  who:
  - player: Josh Allen
    team: BUF
    why: The anchor. Consensus QB1 everywhere. 1.01 if the chance ever comes.
  - player: Drake Maye
    team: NE
    why: QB2 overall finish in 2025; ESPN has him SF QB2.
  - player: Jalen Hurts
    team: PHI
    why: Rushing TD equity, highest floor in the tier.
  - player: Jayden Daniels
    team: WSH
    why: Discounted bounce-back off the injured 2025; top-2 upside.
  - player: Lamar Jackson
    team: BAL
    why: Down 2025, still consensus top tier; strongest rebound bet.
  - player: Joe Burrow
    team: CIN
    why: The one pure-volume arm in the tier - no rushing, elite passing.

tier2_qb1:
  note: 'Branch C anchors (R3) when the elite six are gone by R2. 2025 comps:
    Mayfield 3.09, Nix pick 37.'
  who:
  - player: Caleb Williams
    team: CHI
    tag: personal star
    why: Verified 8/2. Went pick 70 in this room in 2025 - that discount will
      not repeat now that national tiers rank him top-8. R3 anchor or EARLY R5
      QB2, not a wait-and-see.
  - player: Patrick Mahomes
    team: KC
    tag: DEMOTED 8/16 - no longer an R3 anchor
    why: 'Tore his ACL AND LCL on Dec 14 2025; surgery repaired more than the
      ACL. Fully cleared for camp - Reid says full strength and sharp - but he
      sat the preseason opener as a precaution and is targeting Week 1 without
      a guarantee. His ADP has fallen to 101.6 [1QB], roughly 70 picks below
      the rest of this tier. He was listed here with zero injury context. Treat
      him as a discounted upside arm in the QB2 band, NOT a Branch C anchor you
      plan pick 29 around. Bye W5 is also the two-team week - see targets.yaml.'
  - player: C.J. Stroud
    team: HOU
  - player: Justin Herbert
    team: LAC

qb2_window:
  rounds: [5, 6]
  note: Preference order for the R5-6 window. The tally fires the trigger; this
    list answers who.
  who:
  - player: Cam Ward
    team: TEN
    tag: best value
    why: 'Repo #1 on value-vs-cost: Daboll hired to develop him, designed QB
      runs coming, priced as a QB3 (watchlist Tier 1 row). Default QB2 unless
      you own Jefferson.'
  - player: Kyler Murray
    team: MIN
    tag: NAMED 8/11 - ceiling play, #1 IF you own Jefferson
    why: 'NAMED WEEK 1 STARTER 8/11 (multi-source) - the "only if named" tag is
      retired and he is legal. Highest SF ceiling on the board: dual-threat arm
      with Jefferson, Addison and Hockenson. The pre-registered call from the
      watchlist fires - if you hold Jefferson, this is the weekly-payout stack
      and Murray goes first in this order. Without Jefferson he is a very good
      arm and Ward is the better price. CAVEATS: missed most of 2025 on a foot
      injury, and had ugly practice miscues as late as 8/10. Price jumped on
      the announcement - do not chase past R6.'
  - player: Baker Mayfield
    team: TB
    why: Value QB1 who falls. Contract standoff is the camp watch item.
  - player: Daniel Jones
    team: IND
    tag: count the IND cap
    why: Unquestioned Colts QB1 (8/3 camp watch). Jones + Warren is the whole
      cap - Jones + Warren + Downs is the mock-B breach.
  - player: Bo Nix
    team: DEN
  - player: Jordan Love
    team: GB
    tag: 'REPRICED 8/25 - listed here, but at slot 5 he is a QB3 price'
    why: >
      Measured across nine slot-5 reps: taken at R9 in five of eight and ON THE
      BOARD AT PICK 101 every one of those times. ff grade returned VALUE, three
      rounds past his tier, in four consecutive reps. He stays in this tier
      because nationally he is a QB2-window arm, but AT THIS SEAT taking him at
      R6 wastes about three rounds. Take Ward or Murray at R6 and Love at R9.
      See adp.yaml pass_2026_08_25.

qb3_vets:
  rounds: [9, 13]
  note: 'Trade-inventory tier - target R9-10 (2025 comps went picks 101-107).
    All three tests: named Week 1 starter, THIRD distinct bye, R9-13 price.
    Do not telegraph - Trey Action Fake, TheMoneyTeam and Kleenex shop here.'
  who:
  - player: Jordan Love
    team: GB
    tag: 'ADDED 8/25 - the measured default here, cross-listed from qb2_window'
    why: >
      Nine slot-5 reps put him on the board at pick 101. He is the best-value
      arm in the build at this seat and he satisfies all three QB3 tests - named
      starter, R9-13 price, and a W11 bye that triangulates against the usual
      W9/W10 QB2. Prefer him over the vets below when he is there.
  - player: Jared Goff
    team: DET
  - player: Trevor Lawrence
    team: JAX
  - player: Geno Smith
    team: NYJ
    tag: confirm he is NAMED
    why: Leads the Jets battle (watchlist) - a named starter is the test, a
      lean is not.
  - player: Aaron Rodgers
    team: PIT
  fallback:
    player: Tyler Shough
    team: 'NO'
    why: Cheap QB3 with rushing usage if the vet tier evaporates by the R13
      deadline (screen.yaml).

never:
- player: Dak Prescott
  team: DAL
  why: W14 seeding-week bye - never a QB on the W14 bye. Off the board entirely,
    at any price.
