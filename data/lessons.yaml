draft:
  qb4_dart: 'REJECTED at the draft, ADOPTED in-season (QB_LADDER.md, reconciled 8/2): a drafted QB4 breaks
    the 6RB/5WR floor on 17 spots. In-season the ladder is doctrine - churn the last bench spot toward
    a 4th arm when byes approach or a buyer appears; profiles limited to a fallen starter or a backup
    with a real path; QB4 is the FIRST DROP when RB/WR attrition demands the spot, except in an active
    negotiation week.'
  kicker: 'RESOLVED 8/1: K is a MANDATORY starter (was assumed optional). Top-3 kicker lesson applies
    - take the best available K at R16/R17, never earlier, no backup. Stream K/DST in-season with free
    adds only, never a priority burn.'
season:
  week5_patience: 'Give a drafted player until Week 5 before releasing him. One bad month is noise. Exception:
    season-ending injury with zero IR slots - that roster spot is dead capital and triage applies immediately.

    '
