# Single source of truth for league settings.
# Everything in the toolkit reads from here. Edit this, not the code.
# ALL SETTINGS CONFIRMED 8/1/2026 against the open ESPN league
# (FRAMEWORK_RECONCILIATION.md). One item still unverified: playoff team
# count (likely 6) - does not block anything.
name: 2026 Redraft
platform: espn
teams: 12
scoring: full_ppr
scoring_detail:
  pass_yards_per_point: 25   # 0.04/yd - confirmed
  pass_td: 4                 # drives the rushing-QB premium
  interception: -2           # confirmed
  two_point_conversion: 2
superflex: true              # OP slot: QB/RB/WR/TE - second QB starts here weekly
roster_size: 17              # CONFIRMED 8/1 - was wrongly assumed 20
bench_slots: 7               # was assumed ~12; a 42% cut - zero slack for darts
ir_slots: 0                  # CONFIRMED - no injured reserve

starters:                    # 10 total, confirmed 8/1
  QB: 1
  RB: 2
  WR: 2
  TE: 1                      # one dedicated slot; a TE2 CAN also start at FLEX
  FLEX: 1                    # RB/WR/TE - TE IS ELIGIBLE. CORRECTED 8/9 by Josh
                             # from the settings themselves. The earlier
                             # "RB/WR only" read was wrong, and it was the sole
                             # basis for the no-TE2-ever rule. A TE2 is now a
                             # VALUE question (does he beat your RB3/WR3 for
                             # the FLEX slot?), not an eligibility one.
  OP: 1                      # QB/RB/WR/TE - this is the superflex slot
  DST: 1                     # MANDATORY starter - was unmodeled
  K: 1                       # MANDATORY starter - was unmodeled

draft:
  type: snake
  date: 2026-09-06           # CORRECTED 8/13 - Sunday 9:00 PM EST, not Sept 7
  time: '21:00 EST'
  rounds: 17                 # one per roster spot
  slot: null                 # ORDER POSTED 8/13 ~9PM EST - set this as soon as
                             # Josh has it, then rerun: ff tree / ff room --slot N
                             # / ff sheet. The old "revealed draft morning"
                             # assumption is dead; we get ~3.5 weeks of
                             # slot-specific prep instead.

waivers:
  type: rolling_priority
  process: tuesday_night

trade_deadline: 2026-12-04T03:00:00-05:00   # Friday of Week 13 - cannot trade
                                            # out of the IND bye once it looms

season:
  regular_weeks: 14          # CONFIRMED 8/1 - was uncertain 12/13. W14 is the
                             # seeding week and ARI + DAL are on bye in it.
  playoff_start: 15          # CONFIRMED 8/1
  playoff_end: 17
  playoff_teams: 6           # likely - the one setting still unverified

seeding:
  divisions: none            # single 12-team pool
  first_round_bye: top_2
  tiebreaker: head_to_head   # contender matchups carry double weight

payouts:
  weekly_high_score: true
  weekly_payout_weeks: 12
  season_long_lean: slight
  top_two_seeds_bye: true
