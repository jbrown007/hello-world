# Single source of truth for league settings.
# Everything in the toolkit reads from here. Edit this, not the code.
name: 2026 Redraft
platform: espn
teams: 12
scoring: full_ppr
superflex: true          # optional 2QB start
roster_size: 20
ir_slots: 0              # CONFIRMED - no injured reserve
bench_slots: [8, 12]

starters:
  QB: 1
  RB: 2
  WR: 3
  TE: 1
  SUPERFLEX: 1
  FLEX: [1, 2]
  K_DEF: optional

draft:
  type: snake
  date: 2026-09-07       # Labor Day
  slot: null             # revealed draft morning; set it then run `ff tree`

waivers:
  type: rolling_priority
  process: tuesday_night

season:
  # UNCONFIRMED values are written as a list. The toolkit then emits CONDITIONAL
  # warnings covering every scenario instead of guessing one. Replace a list with
  # a single number once you check the league settings; warnings sharpen to CERTAIN.
  regular_weeks: [12, 13]   # CONFIRM - notes said 12; playoffs starting W14 implies 13
  playoff_start: [14, 15]   # CONFIRM - Josh said "14 or 15"
  playoff_end: 17

payouts:
  weekly_high_score: true
  weekly_payout_weeks: 12
  season_long_lean: slight
  top_two_seeds_bye: true
