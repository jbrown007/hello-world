[project]
name = "ff2026"
version = "1.0.0"
description = "2026 superflex fantasy football draft and in-season toolkit"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "PyYAML>=6.0"]

[project.scripts]
ff = "ffcli.cli:main"

[tool.setuptools]
packages = ["ffcli"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
